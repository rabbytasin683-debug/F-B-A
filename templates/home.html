<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f0f2f5}
.nav{background:#1877f2;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:10}
.nav a{color:#fff;text-decoration:none;font-weight:bold}
.card{background:#fff;max-width:520px;margin:12px auto;border-radius:12px;padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.15)}
textarea{width:100%;border:0;outline:0;font-size:18px;resize:none}
.input{width:100%;background:#f0f2f5;border:0;padding:11px 14px;border-radius:20px;margin:8px 0}
.btn{width:100%;background:#1877f2;color:#fff;border:0;padding:11px;border-radius:8px;font-weight:bold;font-size:16px}
.post{max-width:520px;margin:12px auto;background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.post.u{font-weight:bold}
.post.t{color:#65676b;font-size:12px;margin:2px 0 8px}
.post.c{font-size:15px;line-height:1.4}
.post img,.post video{width:100%;border-radius:10px;margin-top:10px;max-height:500px;object-fit:cover}
</style></head><body>
<div class="nav"><div style="font-weight:900;font-size:22px">F-B-A</div><a href="/logout">Logout</a></div>

<div class="card">
<form method="POST" action="/post">
<textarea name="content" rows="2" placeholder="What's on your mind, {{user}}?"></textarea>
<input class="input" name="media" placeholder="Photo/Video link (https://...) থাকলে দাও">
<button class="btn">Post</button>
</form>
</div>

{% for p in posts %}
<div class="post">
<div class="u">{{p[1]}}</div>
<div class="t">{{p[4]}}</div>
<div class="c">{{p[2]}}</div>
{% if p[3] %}
  {% if '.mp4' in p[3] or 'video' in p[3] %}
    <video controls src="{{p[3]}}"></video>
  {% else %}
    <img src="{{p[3]}}">
  {% endif %}
{% endif %}
</div>
{% endfor %}
</body></html>
