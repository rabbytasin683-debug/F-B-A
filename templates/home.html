<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F-B-A</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f0f2f5;font-family:Arial}
.nav{background:#fff;position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:8px 16px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.logo{color:#1877f2;font-size:32px;font-weight:bold}
.nav input{background:#f0f2f5;border:0;padding:9px 12px;border-radius:20px;width:240px;outline:none}
.layout{display:flex;max-width:1250px;margin:0 auto;gap:20px;padding:15px}
.left,.right{width:280px;position:sticky;top:70px;height:fit-content}
.center{flex:1;max-width:590px;margin:0 auto}
.card{background:#fff;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.1);padding:12px;margin-bottom:16px}
.pro{display:flex;align-items:center;gap:10px}
.avatar{width:40px;height:40px;background:#1877f2;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:20px}
.btn{border:0;border-radius:6px;padding:8px 12px;font-weight:bold;cursor:pointer}
.btn-blue{background:#1877f2;color:#fff;width:100%;padding:10px;font-size:16px}
.btn-gray{background:#e4e6eb;width:100%}
textarea{width:100%;border:0;outline:none;font-size:18px;resize:none;background:#f0f2f5;border-radius:20px;padding:10px 14px;margin-top:10px}
.post{padding:12px}
.post.u{font-weight:bold}
.post.t{color:#65676b;font-size:12px}
.post.c{margin:10px 0;font-size:15px;line-height:1.4}
.post img,.post video{width:100%;border-radius:8px;margin-top:8px;max-height:600px;object-fit:cover}
.actions{display:flex;border-top:1px solid #ddd;margin-top:10px;padding-top:6px}
.actions button{flex:1;background:none;border:0;padding:8px;color:#65676b;font-weight:bold;cursor:pointer;border-radius:4px}
.actions button:hover{background:#f2f2f2}
#previewImg{width:100%;border-radius:8px;margin-top:10px;display:none}
@media(max-width:900px){.left,.right{display:none}.nav input{width:120px}}
</style>
</head>
<body>

<div class="nav">
<div class="logo">fba</div>
<input placeholder="🔍 Search F-B-A">
<div style="display:flex;gap:10px;align-items:center">
<span style="font-weight:bold">{{user}}</span>
<a href="/logout" style="text-decoration:none;color:#fff;background:#e4e6eb;color:#000;padding:6px 12px;border-radius:20px">Logout</a>
</div>
</div>

<div class="layout">
<div class="left">
<div class="card">
<div class="pro"><div class="avatar">{{user[0]}}</div><b>{{user}}</b></div>
<button onclick="document.getElementById('editPro').style.display='block'" class="btn btn-gray" style="margin-top:12px">✏️ Edit Profile</button>
<div id="editPro" style="display:none;margin-top:10px;border-top:1px solid #ddd;padding-top:10px">
<p style="font-size:13px;color:#65676b">Profile Edit (Soon you can add bio, cover photo)</p>
<input placeholder="Write your bio" style="width:100%;padding:8px;margin-top:6px;border:1px solid #ccc;border-radius:6px">
<button class="btn btn-blue" style="margin-top:6px" onclick="alert('Profile Updated! (Demo)')">Save</button>
</div>
</div>
<div class="card" style="font-size:14px;color:#050505;line-height:2">📺 Watch
