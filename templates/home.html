<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#f0f2f5;font-family:sans-serif;margin:0}.nav{background:white;padding:12px;display:flex;justify-content:space-between;box-shadow:0 1px 3px #0002}.box{background:white;max-width:500px;margin:15px auto;padding:15px;border-radius:10px}textarea{width:100%;height:60px;border-radius:8px;border:1px solid #ddd;padding:10px}.post{border-top:1px solid #eee;margin-top:12px;padding-top:10px}button{background:#1877f2;color:white;border:none;padding:8px 18px;border-radius:6px}</style></head><body><div class="nav"><b>F-B-A</b><span>{{user}} | <a href="/logout">Logout</a></span></div><div class="box"><form action="/post" method="POST"><textarea name="content" placeholder="What's on your mind, {{user}}?" required></textarea><br><br><button>Post</button></form>{% for p in posts %}<div class="post"><b>{{p[1]}}</b> <small style="color:gray">{{p[3]}}</small><p>{{p[2]}}</p></div>{% endfor %}</div></body></html>
