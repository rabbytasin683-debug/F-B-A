<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<title>F-B-A Pro</title>
<style>
body{margin:0;font-family:Arial;background:#f0f2f5}
.h{background:#1877f2;color:#fff;padding:12px 15px;font-weight:900;font-size:22px;position:sticky;top:0;display:flex;justify-content:space-between}
.c{background:#fff;margin:10px;border-radius:12px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.a{width:40px;height:40px;border-radius:50%;background:#ddd;display:flex;align-items:center;justify-content:center;font-weight:bold;overflow:hidden}
.a img{width:100%;height:100%;object-fit:cover}
img.post,video.post{width:100%;border-radius:10px;margin-top:8px;max-height:450px}
.btn{width:100%;background:#1877f2;color:#fff;border:none;padding:10px;border-radius:8px;font-weight:bold;margin-top:8px}
</style></head><body>
<div class="h"><span>F-B-A</span><span style="font-size:14px"><a href="/logout" style="color:#fff">Logout</a></span></div>
<div class="c">
<form method="POST">
<textarea name="content" placeholder="What's on your mind?" style="width:100%;height:60px;border:none;outline:none;font-size:16px" required></textarea>
<input name="media" placeholder="Photo/Video link (https://... or mp4)" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin-top:6px">
<button class="btn">Post with Photo/Video</button>
</form>
</div>
{% for post in posts %}
<div class="c">
<div style="display:flex;gap:10px;align-items:center">
<div class="a">{% if post[4] %}<img src="{{ post[4] }}">{% else %}{{ post[0][0] }}{% endif %}</div>
<div><b>{{ post[0] }}</b><br><small>{{ post[5] }} • Just now</small></div>
</div>
<p>{{ post[2] }}</p>
{% if post[3] %}
 {% if '.mp4' in post[3] %}<video class="post" controls src="{{ post[3] }}"></video>{% else %}<img class="post" src="{{ post[3] }}">{% endif %}
{% endif %}
</div>
{% endfor %}
<div style="height:60px"></div>
</body></html>
