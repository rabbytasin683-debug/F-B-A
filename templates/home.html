<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F-B-A Pro - Video & Photo</title>
<style>
body{margin:0;font-family:Arial;background:#f0f2f5}
.h{background:#1877f2;color:#fff;padding:12px 15px;font-weight:900;font-size:22px;position:sticky;top:0}
.c{background:#fff;margin:10px;border-radius:12px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.a{width:40px;height:40px;border-radius:50%;background:#1877f2;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold}
img,video{width:100%;border-radius:10px;margin-top:8px;max-height:450px}
.btn{width:100%;background:#1877f2;color:#fff;border:none;padding:10px;border-radius:8px;font-weight:bold;margin-top:8px}
.btm{position:fixed;bottom:0;width:100%;background:#fff;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #ddd}
</style>
</head>
<body>
<div class="h">F-B-A <span style="float:right;font-size:14px">▶ Watch 📷</span></div>

<div class="c">
<form method="POST">
<textarea name="content" placeholder="What's on your mind? " style="width:100%;height:60px;border:none;outline:none;font-size:16px" required></textarea>
<input name="media" placeholder="Photo/Video link paste করো (Imgur, mp4 link)" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin-top:6px">
<button class="btn">Post - Photo/Video সহ</button>
</form>
</div>

{% for post in posts %}
<div class="c">
<div style="display:flex;gap:10px"><div class="a">{{ post[0][0] }}</div><div><b>{{ post[0] }}</b><br><small>Gender • Public • Just now</small></div></div>
<p style="margin:8px 0">{{ post[2] }}</p>
{% if post[3] %}
  {% if '.mp4' in post[3] or 'video' in post[3] %}
    <video controls src="{{ post[3] }}"></video>
  {% else %}
    <img src="{{ post[3] }}">
  {% endif %}
{% endif %}
<div style="display:flex;justify-content:space-around;border-top:1px solid #eee;margin-top:8px;padding-top:8px;color:#65676b;font-weight:bold;font-size:14px">
<span>👍 Like</span><span>💬 Comment</span><span>↗ Share</span>
</div>
</div>
{% endfor %}

<div style="height:70px"></div>
<div class="btm"><div>🏠<br>Home</div><div>▶<br>Watch</div><div style="color:#1877f2">➕<br>Post</div><div>👥<br>Friends</div><div>👤<br>Profile</div></div>
</body>
</html>
