<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;font-family:Arial;display:flex;height:100vh}
.left{width:50%;background:#1e1e1e;display:flex;flex-direction:column}
.right{width:50%;background:#f0f2f5;overflow:auto}
textarea{flex:1;background:#1e1e1e;color:#d4d4d4;border:0;padding:15px;font-family:monospace;font-size:14px;outline:none}
.bar{background:#333;color:white;padding:10px;display:flex;justify-content:space-between}
button{background:#1877f2;color:white;border:0;padding:6px 12px;border-radius:4px}
iframe{width:100%;height:100%;border:0}
</style>
</head>
<body>
<div class="left">
<div class="bar"><span>💻 Code</span><button onclick="run()">▶ Run</button></div>
<textarea id="code" oninput="run()"><div style="background:white;padding:20px;border-radius:10px;margin:20px;box-shadow:0 2px 8px rgba(0,0,0,.1);text-align:center">
<h1 style="color:#1877f2">F-B-A</h1>
<p>এখানে কোড লেখো, ডানে ডিজাইন সাথে সাথে বদলাবে</p>
<div style="background:#f0f2f5;padding:15px;border-radius:8px;margin-top:15px">Post Box Preview</div>
</div></textarea>
</div>
<div class="right">
<div class="bar" style="background:white;color:black;border-bottom:1px solid #ddd">👁️ Live Preview</div>
<iframe id="preview"></iframe>
</div>
<script>
function run(){
  let code = document.getElementById("code").value;
  let preview = document.getElementById("preview").contentDocument;
  preview.open(); preview.write(code); preview.close();
}
run();
</script>
</body>
</html>
