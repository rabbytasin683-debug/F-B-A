<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register - F-B-A</title>
<style>
body{margin:0;font-family:Arial;background:#f0f2f5;display:flex;justify-content:center;align-items:center;min-height:100vh}
.box{background:#fff;padding:20px;border-radius:12px;width:92%;max-width:380px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
input{width:100%;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
.btn{width:100%;background:#1877f2;color:#fff;border:none;padding:12px;border-radius:8px;font-weight:bold;margin-top:10px}
.g{display:flex;gap:6px;margin:6px 0}
.g label{flex:1;border:1px solid #ddd;padding:10px;border-radius:8px;text-align:center}
#pre{width:80px;height:80px;border-radius:50%;object-fit:cover;margin:10px auto;display:none;border:3px solid #1877f2}
</style>
</head>
<body>
<div class="box">
<h2 style="text-align:center;color:#1877f2">Create New Account</h2>
<img id="pre">
<form method="POST" action="/register">
<input name="name" placeholder="Full Name" required>
<input name="email" type="email" placeholder="Email" required>
<div class="g">
<label><input type="radio" name="gender" value="Male" required> Male</label>
<label><input type="radio" name="gender" value="Female"> Female</label>
</div>
<p style="font-size:12px">Profile Photo:</p>
<input type="file" accept="image/*" onchange="const r=new FileReader();r.onload=e=>{document.getElementById('pre').style.display='block';document.getElementById('pre').src=e.target.result;document.getElementById('d').value=e.target.result};r.readAsDataURL(this.files[0])">
<input type="hidden" name="pic" id="d">
<input name="password" type="password" placeholder="Password" required>
<button class="btn">Sign Up</button>
</form>
<p style="text-align:center"><a href="/login">Already have account?</a></p>
</div>
</body>
</html>
