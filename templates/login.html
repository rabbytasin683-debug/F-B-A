<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FBA Login</title>
</head>
<body style="margin:0;background:#f0f2f5;font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh">
<div style="background:white;width:360px;padding:20px;border-radius:10px;box-shadow:0 2px 8px #00000026;text-align:center">
<h1 style="color:#1877f2;margin:0 0 20px 0">F-B-A</h1>
<form method="POST">
<input name="email" type="email" placeholder="Email" required style="width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:6px;box-sizing:border-box">
<input name="pass" type="password" placeholder="Password" required style="width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:6px;box-sizing:border-box">
<button type="submit" style="width:100%;background:#1877f2;color:white;border:none;padding:12px;border-radius:6px;font-weight:bold;font-size:16px;margin-top:10px">Log in</button>
</form>
<a href="/register" style="display:block;margin-top:15px;color:#1877f2;text-decoration:none">Create new account</a>
</div>
</body>
</html>
